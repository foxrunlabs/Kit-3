#===============================================================================
# Program   : Boot Loader
# File Name : memory.conf
# Project   : Kit-3 8-bit Computer
# Author    : Ryan Clarke
# E-mail    : kj6msg@icloud.com
#===============================================================================
# Purpose   : Linker configuration file for the Kit-3 boot loader.
#===============================================================================


#= MEMORY MAP ==================================================================

MEMORY
{
    ZP:
        start  = $0000,
        size   = $0100,
        fill   = yes;
    
    STACK:
        start  = $0100,
        size   = $0100,
        fill   = yes;
    
    IO:
        start  = $0200,
        size   = $0100,
        fill   = yes,
        define = yes;
    
    USER:
        start  = $0300,
        size   = $ED00,
        fill   = yes,
        define = yes;
    
    BOOT:
        start  = $F000,
        size   = $1000,
        fill   = yes,
        file   = %O,
        define = yes;
}


#= SEGMENTS ====================================================================

SEGMENTS
{
    CODE:
        load  = BOOT,
        type  = rw;
    
    DATA:
        load  = BOOT,
        type  = rw;

    RODATA:
        load  = BOOT,
        type  = ro;
    
    BSS:
        load  = BOOT,
        type  = bss;
    
    VECTORS:
        load  = BOOT,
        type  = ro,
        start = $FFFA;
}
